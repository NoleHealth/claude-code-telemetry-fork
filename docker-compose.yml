version: '3.8'

services:
  telemetry-server:
    build: .
    container_name: claude-code-telemetry-telemetry-server-1
    ports:
      - "4318:4318"
    environment:
      - OTLP_RECEIVER_HOST=0.0.0.0
      - OTLP_RECEIVER_PORT=4318
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://localhost:3020}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-production}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-3600000}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-10485760}
      - API_KEY=${API_KEY:-}
      - REDIS_URL=redis://redis-shared:6379/0
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4318/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - coremind-shared

networks:
  default:
    name: claude-code-telemetry_default
  coremind-shared:
    external: true